[package]
name = "lettuce-tauri"
readme = "README.md"
description = "LettuceAI Tauri shell: Tauri commands over the application API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "lettuce-tauri"

[lints]
workspace = true

[lib]
name = "lettuce_tauri"
path = "src/lib.rs"

[[bin]]
name = "lettuce-tauri"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
vulkan = ["lettuce-app/llama-vulkan", "lettuce-app/asr-vulkan"]
cuda = ["lettuce-app/llama-cuda", "lettuce-app/asr-cuda"]
metal = ["lettuce-app/llama-metal", "lettuce-app/asr-metal"]

[dependencies]
lettuce-app.workspace = true
lettuce-contracts = { workspace = true, features = ["specta"] }
lettuce-observability.workspace = true
lettuce-settings.workspace = true
same-file = "1.0.6"
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
cpal = "0.16.0"
tauri-plugin-dialog.workspace = true
tauri-plugin-single-window.workspace = true

[build-dependencies]
tauri-build.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
cpal = "0.16.0"
tauri-plugin-android-fs.workspace = true
jni = "0.21.1"
ndk-context = "0.1.1"
