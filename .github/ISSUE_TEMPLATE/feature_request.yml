name: Feature request
description: Propose an improvement that fits LettuceAI's direction
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        LettuceAI is a private, local-first AI roleplay app for mobile and desktop. Explain the user problem first so the proposed solution can be evaluated in that context.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat and roleplay
        - Group chats
        - Companions
        - Memory
        - Lorebooks
        - Characters or personas
        - Creation Helper
        - Remote providers and models
        - Local models (llama.cpp)
        - Image generation
        - Speech (text to speech or transcription)
        - Sync between devices
        - Backup, import or export
        - Settings
        - Interface
        - Platform support
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the missing or frustrating workflow from the user's perspective.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain how the feature should work and where it belongs in the existing interface.
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Expected workflow
      description: Walk through the main user interaction from start to finish.
      placeholder: |
        1. The user...
        2. LettuceAI...
        3. The user...

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Where should this work?
      multiple: true
      options:
        - Android
        - iOS
        - Windows
        - macOS
        - Linux

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any simpler approaches, workarounds or designs you considered.

  - type: textarea
    id: references
    attributes:
      label: References or mockups
      description: Add screenshots, sketches or examples from other apps when they clarify the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same request.
          required: true
        - label: This request describes one focused feature rather than several unrelated changes.
          required: true
