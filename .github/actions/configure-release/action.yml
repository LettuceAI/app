name: Configure release identity
description: Apply a consistent build version and the dev or stable identity in CI.

inputs:
  version:
    description: Version prepared by the release workflow.
    required: true
  dev:
    description: Whether to install separately as the dev app.
    required: true
  android:
    description: Use the committed Android namespace and override only its application ID.
    default: 'false'
  android-version-code:
    description: Monotonic Android version code prepared by the release workflow.
    default: '1'

runs:
  using: composite
  steps:
    - name: Fetch the checked-in dependency lockfile
      shell: bash
      run: cargo fetch --locked
    - name: Write build identity and bundle overrides
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        DEV_BUILD: ${{ inputs.dev }}
        ANDROID_BUILD: ${{ inputs.android }}
        ANDROID_CODE: ${{ inputs.android-version-code }}
      run: |
        node <<'JS'
        const fs = require('node:fs');
        const version = process.env.RELEASE_VERSION;
        const dev = process.env.DEV_BUILD === 'true';
        const android = process.env.ANDROID_BUILD === 'true';
        if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid build version');
        for (const path of ['package.json', 'apps/ui/package.json']) {
          const data = JSON.parse(fs.readFileSync(path));
          data.version = version;
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
        }
        const manifest = fs.readFileSync('Cargo.toml', 'utf8');
        if (!/\[workspace\.package\]\s*\nversion\s*=/.test(manifest)) throw new Error('Workspace version was not found');
        fs.writeFileSync('Cargo.toml', manifest.replace(/(\[workspace\.package\]\s*\nversion\s*=\s*)"[^"]+"/, `$1"${version}"`));
        const override = {version, bundle: {windows: {wix: {version: version.split('-')[0]}}, macOS: {signingIdentity: '-'}}};
        if (dev) {
          override.productName = 'lettuceai-dev';
          if (!android) override.identifier = 'dev.lettuceai.app';
          if (!android) {
            const platform = {macOS: 'macos', Windows: 'windows', Linux: 'linux'}[process.env.RUNNER_OS];
            const platformPath = `apps/tauri/tauri.${platform}.conf.json`;
            const platformConfig = fs.existsSync(platformPath) ? JSON.parse(fs.readFileSync(platformPath)) : {};
            const windows = platformConfig.app?.windows ?? JSON.parse(fs.readFileSync('apps/tauri/tauri.conf.json')).app.windows;
            override.app = {windows: windows.map(window => ({...window, title: 'LettuceAI (Dev)'}))};
          }
        }
        if (android) {
          override.bundle.android = {versionCode: Number(process.env.ANDROID_CODE), autoIncrementVersionCode: false};
          const identifier = dev ? 'dev.lettuceai.app' : 'com.lettuceai.app';
          fs.appendFileSync(process.env.GITHUB_ENV, `LETTUCE_ANDROID_APPLICATION_ID=${identifier}\n`);
          const shortcuts = 'apps/tauri/gen/android/app/src/main/res/xml/shortcuts.xml';
          fs.writeFileSync(shortcuts, fs.readFileSync(shortcuts, 'utf8').replace(/android:targetPackage="[^"]+"/g, `android:targetPackage="${identifier}"`));
          if (dev) {
            const strings = 'apps/tauri/gen/android/app/src/main/res/values/strings.xml';
            fs.writeFileSync(strings, fs.readFileSync(strings, 'utf8').replace(/(<string name="(?:app_name|main_activity_title)">)[^<]*/g, '$1LettuceAI (Dev)'));
          }
        }
        fs.writeFileSync('.release-config.json', JSON.stringify(override, null, 2) + '\n');
        JS
    - name: Update workspace versions without upgrading dependencies
      shell: bash
      run: cargo update --workspace --offline
