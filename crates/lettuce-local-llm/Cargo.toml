[package]
name = "lettuce-local-llm"
readme = "README.md"
description = "Local llama.cpp and Ollama runtime adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-2/cuda-no-vmm"]
rocm = ["llama-cpp-2/rocm"]
vulkan = ["llama-cpp-2/vulkan"]
metal = ["llama-cpp-2/metal"]

[dependencies]
lettuce-types.workspace = true
rand.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
llama-cpp-2.workspace = true
llama-cpp-sys-2.workspace = true
sysinfo.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
