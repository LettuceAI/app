[package]
name = "lettuce-platform"
readme = "README.md"
description = "Platform lifecycle, managed paths, filesystem capabilities, and updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sysinfo.workspace = true
cap-primitives.workspace = true
cap-std.workspace = true
same-file = "1.0.6"
fs4 = { version = "0.13.1", default-features = false, features = ["sync"] }
lettuce-types.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
libloading.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["event"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
dispatch2 = "0.3.1"
block2 = "0.6"
