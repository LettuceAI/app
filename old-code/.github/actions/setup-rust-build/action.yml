name: Setup cached Rust build
description: Install Rust and cache Rust, C/C++, and CUDA compiler outputs.

inputs:
  cache-key:
    description: Stable cache namespace for this platform and accelerator backend.
    required: true
  cache-workspaces:
    description: Cargo workspace and target-directory mapping for rust-cache.
    required: false
    default: "src-tauri -> target"
  cache-targets:
    description: Cache Cargo target artifacts in addition to compiler outputs.
    required: false
    default: "true"
  target:
    description: Optional comma-separated Rust targets to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: "1.97.1"
        target: ${{ inputs.target }}
        cache: true
        rust-src-dir: src-tauri
        cache-workspaces: ${{ inputs.cache-workspaces }}
        cache-shared-key: ${{ inputs.cache-key }}
        cache-targets: ${{ inputs.cache-targets }}

    - name: Install compiler cache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: Enable compiler cache
      shell: bash
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "RUSTC_WRAPPER=sccache"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          echo "CMAKE_CUDA_COMPILER_LAUNCHER=sccache"
        } >> "$GITHUB_ENV"
